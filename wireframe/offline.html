<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F4F1EA">
  <title>電波がありません · Aroid Origins</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #F4F1EA; color: #1E2622; }
    body { font-family: "Noto Sans JP", "BIZ UDPGothic", "Helvetica Neue", Arial, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; line-height: 1.7; }
    .sheet { max-width: 420px; width: 100%; border: 1px dashed #8A8F87; padding: 24px 20px; }
    .mark { font-family: "Cormorant Garamond", Georgia, serif; font-size: 1rem; letter-spacing: 0.08em; margin-bottom: 16px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.6rem; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #4B524D; }
    button { margin-top: 20px; min-height: 44px; padding: 0 20px; border: 1px solid #1E2622; background: #1E2622; color: #F4F1EA; font: inherit; border-radius: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <main class="sheet">
    <p class="mark">AROID ORIGINS</p>
    <h1>電波がありません</h1>
    <p>電波が戻ったら、もう一度開いてください。書きかけの投稿は、この端末に下書きとして残っています。</p>
    <button type="button" onclick="location.reload()">もう一度</button>
  </main>
</body>
</html>
