name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Daily 03:00 JST — keeps sitemap & SEO stubs fresh as cultivars are added
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate sitemap from Supabase
        run: node scripts/generate-sitemap.js
      - name: Render share cards
        run: node scripts/make-og-cards.js
      - name: Generate static SEO stub pages
        run: node scripts/generate-static-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wireframe
      - id: deployment
        uses: actions/deploy-pages@v4
