name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  schedule:
    # Every 30 minutes: a new entry gets its page, share card and sitemap line within 30 minutes (board 9, T116).
    # A run with nothing new stops after the first check (the build stamp is the same as the live site's).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Has the archive changed since the live build?
        id: changed
        run: |
          NOW=$(node scripts/build-stamp.js)
          LIVE=$(curl -fsS https://aroidorigins.com/data/build-stamp.txt || echo none)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NOW" = "$LIVE" ]; then echo 'run=false' >> "$GITHUB_OUTPUT"; echo 'Nothing new: skipped'; else echo 'run=true' >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: npm ci
      - name: Check that stubs and site pick the same country
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-geo-parity.js
      - name: Check names and texts (report only)
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-names.js
      - name: Check that every PNG decodes (report only)
        if: steps.changed.outputs.run == 'true'
        run: node scripts/check-png.js
        continue-on-error: true
      - name: Generate sitemap from Supabase
        if: steps.changed.outputs.run == 'true'
        run: node scripts/generate-sitemap.js
      - name: Make the photo copies served from Pages
        if: steps.changed.outputs.run == 'true'
        run: node scripts/build-photos.js
      - name: Render share cards
        if: steps.changed.outputs.run == 'true'
        run: node scripts/make-og-cards.js
      - name: Render Instagram images
        if: steps.changed.outputs.run == 'true'
        run: node scripts/make-ig-images.js
      - name: Record the build stamp
        if: steps.changed.outputs.run == 'true'
        run: node scripts/build-stamp.js --write
      - name: Write the list file the app starts from
        if: steps.changed.outputs.run == 'true'
        run: node scripts/build-cultivars-json.js
      - name: Generate static SEO stub pages
        if: steps.changed.outputs.run == 'true'
        run: node scripts/generate-static-pages.js
      # 11-27: shrink the scripts and styles that phones download (about 30% less, gzip 341 KB -> 239 KB).
      # Runs last, after every step that reads wireframe/js, so the checks and generators see the source.
      # JS keeps its syntax as written: full --minify (syntax rewrite) broke the plant page in app-core.js.
      - name: Shrink scripts and styles for the live site
        if: steps.changed.outputs.run == 'true'
        run: |
          npx --yes esbuild@0.24.0 wireframe/js/*.js --minify-whitespace --minify-identifiers --log-level=warning --outdir=wireframe/js --allow-overwrite
          npx --yes esbuild@0.24.0 wireframe/css/*.css --minify --log-level=warning --outdir=wireframe/css --allow-overwrite
      - uses: actions/configure-pages@v5
        if: steps.changed.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changed.outputs.run == 'true'
        with:
          path: wireframe
      # 11-24/25: deploy-pages sometimes asks for the artifact before GitHub lists it ("No artifacts named
      # github-pages were found"); a short wait before the deploy step avoids that race
      - name: Wait for the artifact to be listed
        if: steps.changed.outputs.run == 'true'
        run: sleep 20
      - id: deployment
        if: steps.changed.outputs.run == 'true'
        uses: actions/deploy-pages@v4
